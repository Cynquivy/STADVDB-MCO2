<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Node status · MCO2 DDB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@350..600&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">MCO2 <span>DDB</span></a>
    <nav class="nav-links" aria-label="Pages">
      <a class="nav-link is-active" href="/status.html" aria-current="page">Status</a>
      <a class="nav-link" href="/payments.html">Payments</a>
    </nav>
    <span class="app-pill" id="app-node" title="The VM whose app served this page">Connecting…</span>
  </header>

  <main class="page">
    <section class="toolbar">
      <h1>Node status</h1>
      <div class="toolbar-actions">
        <button class="btn-primary" id="check-now" type="button">Check now</button>
        <span class="muted" id="checked-at">Checking…</span>
        <input class="input input-sm" id="admin-token" type="password" autocomplete="off"
               placeholder="Admin token" aria-label="Admin token, needed for Kill and Restore" hidden>
      </div>
    </section>

    <div class="banner" id="banner" role="alert" hidden></div>

    <section class="roles" id="roles" aria-label="Primary and secondary copy of each store" aria-live="polite"></section>

    <section class="node-grid" id="nodes" aria-live="polite"></section>

    <section class="events" id="events" aria-label="Role changes" hidden></section>
  </main>

  <footer class="footer">STADVDB MCO2 · Three-node distributed database</footer>

  <script type="module" src="/js/status.js"></script>
</body>
</html>
